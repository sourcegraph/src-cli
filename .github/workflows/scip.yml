name: SCIP
on:
  workflow_dispatch:
  push:
jobs:
  scip-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get Go version from mise
        id: mise
        run: echo "go-version=$(grep 'golang' mise.toml | cut -d'"' -f2)" >> $GITHUB_OUTPUT
      - name: Set up Go
        uses: sourcegraph/actions/go-setup@main
        with:
          go-version: ${{ steps.mise.outputs.go-version }}

      # Built with the same Go toolchain as src-cli, so scip-go recognizes
      # every stdlib package of that Go version. The sourcegraph/scip-go
      # Docker image stopped at v0.1.26 (Go 1.26) and fails on Go 1.27.
      - name: Install scip-go
        run: go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.9

      - name: Build src-cli
        run: go build -o ./src-cli ./cmd/src

      - name: Generate SCIP data
        run: scip-go

      - name: Upload SCIP to Cloud
        run: ./src-cli code-intel upload -github-token='${{ secrets.GITHUB_TOKEN }}' -no-progress
        env:
          SRC_ENDPOINT: https://sourcegraph.com/
          SRC_ACCESS_TOKEN: ${{ secrets.SRC_ACCESS_TOKEN_DOTCOM }}

      - name: Upload SCIP to S2
        run: ./src-cli code-intel upload -github-token='${{ secrets.GITHUB_TOKEN }}' -no-progress
        env:
          SRC_ENDPOINT: https://sourcegraph.sourcegraph.com/
          SRC_ACCESS_TOKEN: ${{ secrets.SRC_ACCESS_TOKEN_S2 }}

      - name: Compress SCIP file
        run: gzip index.scip

      - name: Upload compressed SCIP to Cloud
        run: ./src-cli code-intel upload -github-token='${{ secrets.GITHUB_TOKEN }}' -no-progress
        env:
          SRC_ENDPOINT: https://sourcegraph.com/
          SRC_ACCESS_TOKEN: ${{ secrets.SRC_ACCESS_TOKEN_DOTCOM }}

      - name: Upload compressed SCIP to S2
        run: ./src-cli code-intel upload -github-token='${{ secrets.GITHUB_TOKEN }}' -no-progress
        env:
          SRC_ENDPOINT: https://sourcegraph.sourcegraph.com/
          SRC_ACCESS_TOKEN: ${{ secrets.SRC_ACCESS_TOKEN_S2 }}
