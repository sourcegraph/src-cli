name: GoReleaser check

on:
  push:
  workflow_dispatch:
jobs:
  goreleaser:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # `goreleaser check` only parses the config; it needs neither Go nor
      # git history.
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned: GoReleaser v2.10+ deprecates `brews`, which fails
          # `goreleaser check`. Unpin after moving to `homebrew_casks`.
          version: v2.9.0
          args: check
