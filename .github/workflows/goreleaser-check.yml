name: GoReleaser check

on:
  push:
  workflow_dispatch:
jobs:
  goreleaser:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # `goreleaser check` only parses the config; it needs neither Go nor
      # git history.
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: check
