name: Go CI

on:
  workflow_dispatch:
  push:
jobs:
  go-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Go version from mise
        id: mise
        run: echo "go-version=$(grep 'golang' mise.toml | cut -d'"' -f2)" >> $GITHUB_OUTPUT
        shell: bash
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.mise.outputs.go-version }}
          # setup-go's built-in cache keys on go.sum alone, has no fallback
          # when go.sum changes, and shares one key across every job on the
          # same OS, so the first job to finish (even one that compiled
          # nothing) decides what everyone else restores. See the explicit
          # cache step below instead.
          cache: false
      - name: Find Go cache directories
        id: go-cache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-go${{ steps.mise.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-go${{ steps.mise.outputs.go-version }}-
      # bash on every OS: the default pwsh on Windows does not fail the step
      # when a command in a multi-line script exits non-zero.
      - run: go test -race -v ./...
        shell: bash

  # This job provides a stable name for branch protection rules
  # It will only pass if all Go CI matrix tests above pass
  go-test-complete:
    runs-on: ubuntu-latest
    needs: go-test
    if: always()
    steps:
      - name: Check Go CI results
        run: |
          if [[ "${{ needs.go-test.result }}" != "success" ]]; then
            echo "One or more Go CI tests failed"
            exit 1
          fi
          echo "All Go CI tests passed"
